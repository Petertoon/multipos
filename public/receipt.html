<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt</title>
<link rel="stylesheet" href="/receipt.css">
</head>
<body>
<div class="r" id="r">Loading…</div>
<div class="noprint"><button onclick="print()">Print</button> <button onclick="close()">Close</button></div>
<script src="/app.js"></script>
<script>
// Staff view (logged in): /receipt?id=123 — opens the print dialog automatically.
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const s = await api('/api/sales/' + encodeURIComponent(id));
  $('#r').innerHTML = receiptHtml(s);
  setTimeout(() => print(), 300);
})().catch((e) => { $('#r').textContent = e.message; });
</script>
</body>
</html>
