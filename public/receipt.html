<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receipt</title>
<style>
  body { font-family: ui-monospace, "Courier New", monospace; font-size: 13px; color: #000; background: #fff; margin: 0; }
  .r { width: 72mm; margin: 0 auto; padding: 8px 4px; }
  .c { text-align: center; }
  h1 { font-size: 17px; margin: 4px 0; }
  img { max-width: 50mm; max-height: 22mm; }
  hr { border: 0; border-top: 1px dashed #000; margin: 8px 0; }
  .l { display: flex; justify-content: space-between; gap: 8px; }
  .l span:last-child { white-space: nowrap; }
  .big { font-size: 16px; font-weight: bold; }
  .void { font-size: 22px; font-weight: bold; text-align: center; border: 2px solid #000; margin: 8px 0; }
  .noprint { text-align: center; margin: 16px; }
  .noprint button { font: 15px system-ui; padding: 10px 18px; }
  @media print { .noprint { display: none; } @page { margin: 0; } }
</style>
</head>
<body>
<div class="r" id="r">Loading…</div>
<div class="noprint"><button onclick="print()">Print</button> <button onclick="close()">Close</button></div>
<script src="/app.js"></script>
<script>
(async () => {
  const id = new URLSearchParams(location.search).get('id');
  const s = await api('/api/sales/' + encodeURIComponent(id));
  const d = new Date(s.created_at);
  $('#r').innerHTML = `<div class="c">${s.logo_url ? `<img src="${esc(s.logo_url)}" alt="">` : ''}<h1>${esc(s.business_name)}</h1>
    <div>${esc(s.location_name)}</div>${s.location_address ? `<div>${esc(s.location_address)}</div>` : ''}${s.location_phone ? `<div>${esc(s.location_phone)}</div>` : ''}</div>
    <hr><div class="l"><span>Sale #${s.id}</span><span>${d.toLocaleDateString()} ${d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}</span></div>
    ${s.cashier ? `<div>Cashier: ${esc(s.cashier)}</div>` : ''}
    ${s.voided ? '<div class="void">VOID</div>' : ''}<hr>
    ${s.items.map((it) => `<div class="l"><span>${esc(it.name)}${it.taxable ? '' : ' (NT)'}</span><span>${money(it.line_cents)}</span></div>
      ${it.qty > 1 ? `<div>&nbsp;&nbsp;${it.qty} @ ${money(it.unit_cents)}</div>` : ''}`).join('')}
    <hr><div class="l"><span>Subtotal</span><span>${money(s.subtotal_cents)}</span></div>
    <div class="l"><span>Tax (${Number(s.tax_rate)}%)</span><span>${money(s.tax_cents)}</span></div>
    <div class="l big"><span>TOTAL</span><span>${money(s.total_cents)}</span></div><hr>
    <div class="l"><span>Paid by ${esc(s.payment_method)}</span><span>${money(s.tendered_cents ?? s.total_cents)}</span></div>
    ${s.payment_method === 'cash' ? `<div class="l"><span>Change</span><span>${money(s.change_cents || 0)}</span></div>` : ''}
    <hr><div class="c">Thank you!</div>`;
  setTimeout(() => print(), 300);
})().catch((e) => { $('#r').textContent = e.message; });
</script>
</body>
</html>
