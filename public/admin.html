<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>MultiPOS Manage</title>
<link rel="stylesheet" href="/style.css">
<style>
  main { padding: 16px; max-width: 1100px; margin: 0 auto; }
  .bar { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 12px; }
  .bar h2 { margin: 0; flex: 1; }
  .bar input, .bar select { width: auto; }
  .banner { background: #fff4d6; padding: 10px 16px; display: flex; gap: 12px; align-items: center; }
  .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .stat { background: #fff; border-radius: 10px; padding: 14px; }
  .stat div { color: var(--muted); font-size: 13px; }
  .stat b { font-size: 24px; font-variant-numeric: tabular-nums; }
  .locbox { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .locbox h3 { margin: 0; display: flex; gap: 10px; align-items: center; }
  .locbox h3 span { flex: 1; }
  .regs { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
  .reg { border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; display: flex; gap: 8px; align-items: center; }
  .reg button { padding: 4px 8px; font-size: 13px; }
  .tablewrap { overflow-x: auto; }
  td button { padding: 6px 10px; font-size: 14px; }
  .settings { background: #fff; border-radius: 10px; padding: 18px; max-width: 520px; margin-bottom: 14px; }
  .thumb { width: 44px; height: 44px; border-radius: 8px; object-fit: cover; background: #eef1ec; display: block; }
  .thumb.none { display: flex; align-items: center; justify-content: center; color: #aab; font-size: 20px; }
  .photo-preview { width: 100%; max-height: 280px; object-fit: contain; background: #f4f5f3; border-radius: 10px; margin: 10px 0; }
  .photo-actions { display: grid; gap: 8px; }
  .formhead { font-weight: 800; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); }
  .rentpill { background: #fff3e0; color: #8a4b00; }
  button.rentson { background: #fff3e0; color: #8a4b00; }
  .stat.refund b { color: #c0392b; }
  .badge { background: #e74c3c; color: #fff; border-radius: 99px; padding: 1px 7px; font-size: 12px; margin-left: 4px; }
  .pgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 12px; }
  .pcard { background: #fff; border-radius: 10px; padding: 12px; display: flex; gap: 12px; }
  .pcard > img, .pnone { width: 110px; height: 110px; border-radius: 8px; object-fit: cover; flex: none; background: #eef1ec; }
  .pnone { display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 28px; color: #9aa; }
  .pnone span { font-size: 12px; }
  .pbody { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .pact { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 6px; }
  .pact button { padding: 8px 12px; font-size: 14px; }
  .warn { background: #fff4d6; border-radius: 6px; padding: 6px 8px; font-size: 13px; }
  .photofield { display: flex; gap: 12px; align-items: center; }
  .photofield img { width: 84px; height: 84px; border-radius: 10px; object-fit: cover; background: #eef1ec; flex: none; }
  .photofield .thumb { width: 84px; height: 84px; font-size: 28px; flex: none; }
  .photobtns { display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
</style>
</head>
<body>
<div class="topbar">
  <div class="brand">MultiPOS</div>
  <div class="biz" id="bizName"></div>
  <div class="spacer"></div>
  <span id="nav"></span>
  <button class="link" onclick="logout()">Log out</button>
</div>
<div class="banner" id="actingBanner" hidden>
  <span>You are working inside <b id="actingName"></b> as platform administrator.</span>
  <button onclick="exitBusiness()">Back to all businesses</button>
</div>
<main id="view"></main>

<div class="modal-back" id="formModal"><form class="modal" id="form"></form></div>

<div class="modal-back" id="photoModal">
  <div class="modal">
    <h2 id="photoTitle">Product photo</h2>
    <img id="photoPreview" class="photo-preview" alt="" hidden>
    <div id="photoNone" class="muted" style="margin:10px 0">No photo yet.</div>
    <div class="photo-actions">
      <button class="primary" id="photoPick">Choose or take a photo</button>
      <button class="ghost" id="photoRemove">Remove photo</button>
    </div>
    <input type="file" id="photoFile" accept="image/*" hidden>
    <div class="actions"><button type="button" class="ghost" id="photoClose">Done</button></div>
  </div>
</div>

<script src="/app.js"></script>
<script>
let me, role;
const TABS = [
  { id: 'businesses', label: 'Businesses', show: () => me.user.role === 'admin' && !me.business },
  { id: 'products', label: 'Products', show: () => !!me.business },
  { id: 'pending', label: 'Pending items', show: () => !!me.business },
  { id: 'refunds', label: 'Refunds owed', show: () => !!(me.business && me.business.rentals_enabled) },
  { id: 'locations', label: 'Locations', show: () => !!me.business },
  { id: 'employees', label: 'Employees', show: () => !!me.business },
  { id: 'sales', label: 'Sales', show: () => !!me.business },
  { id: 'settings', label: 'Settings', show: () => true },
];
const PRODUCT_FORM = [
  { name: 'name', label: 'Product name', required: true },
  { name: 'photo', label: 'Photo', type: 'photo' },
  { name: 'barcode', label: 'Barcode (UPC / EAN / QR text)', hint: 'Leave blank for items without a barcode. A USB scanner can type it here.' },
  { name: 'category', label: 'Category', hint: 'Shown as a tab on the checkout screen, e.g. Drinks' },
  { name: 'price_cents', label: 'Price', type: 'money', required: true },
  { name: 'taxable', label: 'Taxable', type: 'check' },
  { name: 'track_stock', label: 'Track stock for this product', type: 'check' },
  { name: 'stock_qty', label: 'Quantity in stock', type: 'number' },
  { name: 'active', label: 'Show at checkout', type: 'check' },
];
const RENTAL_FORM = [
  { type: 'heading', name: '_rent', label: 'Rental', hint: 'Only for items you rent out. Leave a rate blank if you don\'t offer that period. Customers prepay.' },
  { name: 'is_rental', label: 'This is a rental item', type: 'check' },
  { name: 'rate_half_day', label: 'Half day rate', type: 'money' },
  { name: 'rate_day', label: 'Day rate (multiple days = this × days)', type: 'money' },
  { name: 'rate_week', label: 'Week rate', type: 'money' },
  { name: 'rate_month', label: 'Month rate', type: 'money' },
  { name: 'rental_units', label: 'How many of this item you have to rent', type: 'number' },
];
// The product form, with rental fields when this business has Rentals turned on.
function productForm() {
  if (!(me.business && me.business.rentals_enabled)) return PRODUCT_FORM;
  return [...PRODUCT_FORM.map((f) => (f.name === 'price_cents'
    ? { ...f, required: false, label: 'Price (for items you sell; leave blank for rental-only items)' } : f)), ...RENTAL_FORM];
}
// Saves a product form: blank price only allowed on rental items.
function checkProduct(v) {
  if (!v.is_rental && v.price_cents == null) throw new Error('Enter a price, or check "This is a rental item"');
  return v;
}
let pendingCount = 0;

// ---------- generic form modal ----------
// fields: {name, label, type: text|email|password|money|number|check|select|color, options, required, hint}
function formModal(title, fields, values = {}, submitLabel = 'Save') {
  return new Promise((resolve) => {
    const f = $('#form');
    f.innerHTML = `<h2>${esc(title)}</h2>${fields.map((x) => {
      const v = values[x.name];
      if (x.type === 'heading') return `<div class="formhead">${esc(x.label)}</div>${x.hint ? `<div class="muted" style="font-size:13px">${esc(x.hint)}</div>` : ''}`;
      if (x.type === 'check') return `<label class="check"><input type="checkbox" name="${x.name}" ${v ? 'checked' : ''}> ${esc(x.label)}</label>`;
      if (x.type === 'photo') return `<label>${esc(x.label)}</label><div class="photofield">
        <img data-photo-img alt="" ${v ? `src="${esc(v)}"` : 'hidden'}><div class="thumb none" data-photo-none ${v ? 'hidden' : ''}>📷</div>
        <div class="photobtns"><button type="button" data-photo-pick>${v ? 'Change photo' : 'Choose or take a photo'}</button>
        <button type="button" class="ghost" data-photo-clear ${v ? '' : 'hidden'}>Remove</button></div>
        <input type="file" accept="image/*" data-photo-file hidden></div>`;
      if (x.type === 'select') return `<label>${esc(x.label)}</label><select name="${x.name}">${x.options.map((o) => `<option value="${esc(o.value)}" ${String(o.value) === String(v) ? 'selected' : ''}>${esc(o.label)}</option>`).join('')}</select>`;
      const val = x.type === 'money' ? (v == null ? '' : (v / 100).toFixed(2)) : (v ?? '');
      const type = x.type === 'money' ? 'text' : (x.type || 'text');
      return `<label>${esc(x.label)}</label><input name="${x.name}" type="${type}" value="${esc(val)}" ${x.type === 'money' ? 'inputmode="decimal"' : ''} ${x.required ? 'required' : ''} ${x.type === 'number' ? 'step="any"' : ''}>${x.hint ? `<div class="muted" style="font-size:13px;margin-top:4px">${esc(x.hint)}</div>` : ''}`;
    }).join('')}<div class="err" id="formErr"></div>
    <div class="actions"><button type="button" class="ghost" id="formCancel">Cancel</button><button class="primary">${esc(submitLabel)}</button></div>`;
    $('#formModal').classList.add('open');
    const first = f.querySelector('input:not([type=checkbox]), select'); if (first) first.focus();
    // Photo field state: a new photo (data URL), a removal, or unchanged.
    const photoField = fields.find((x) => x.type === 'photo');
    const startPhoto = photoField ? values[photoField.name] : null;
    const photo = { data: startPhoto && String(startPhoto).startsWith('data:') ? startPhoto : null, removed: false };
    if (photoField) {
      const img = f.querySelector('[data-photo-img]'), none = f.querySelector('[data-photo-none]');
      const pick = f.querySelector('[data-photo-pick]'), clear = f.querySelector('[data-photo-clear]'), file = f.querySelector('[data-photo-file]');
      const show = (src) => { img.hidden = !src; none.hidden = !!src; clear.hidden = !src; if (src) img.src = src; pick.textContent = src ? 'Change photo' : 'Choose or take a photo'; };
      pick.onclick = () => file.click();
      file.onchange = async () => {
        const fl = file.files[0]; file.value = ''; if (!fl) return;
        pick.disabled = true; pick.textContent = 'Preparing…';
        try { photo.data = await resizeImage(fl); photo.removed = false; show(photo.data); }
        catch (e) { toast(e.message, 'bad'); show(img.hidden ? null : img.src); }
        finally { pick.disabled = false; }
      };
      clear.onclick = () => { photo.data = null; photo.removed = true; show(null); };
    }
    const close = (out) => { $('#formModal').classList.remove('open'); f.onsubmit = null; resolve(out); };
    $('#formCancel').onclick = () => close(null);
    f.onsubmit = (e) => {
      e.preventDefault();
      const out = {};
      for (const x of fields) {
        const el = f.elements[x.name];
        if (x.type === 'photo') out[x.name] = photo.data || (photo.removed && startPhoto ? 'remove' : null);
        else if (x.type === 'check') out[x.name] = el.checked;
        else if (x.type === 'heading') continue;
        else if (x.type === 'money') {
          if (!x.required && !el.value.trim()) { out[x.name] = null; continue; }
          const c = toCents(el.value);
          if (c === null) { $('#formErr').textContent = `${x.label}: enter an amount like 4.99`; return; }
          out[x.name] = c;
        } else out[x.name] = el.value;
      }
      close(out);
    };
  });
}
// Runs a save; shows the error and re-opens the form if it fails.
async function saveLoop(title, fields, values, fn, submitLabel) {
  for (;;) {
    const v = await formModal(title, fields, values, submitLabel);
    if (!v) return false;
    try { await fn(v); toast('Saved'); return true; }
    catch (e) { toast(e.message, 'bad'); values = v; }
  }
}

// ---------- businesses (platform admin) ----------
async function showBusinesses() {
  const list = await api('/api/admin/businesses');
  $('#view').innerHTML = `<div class="bar"><h2>Businesses</h2><button class="primary" id="addBiz">+ New business</button></div>
    <div class="tablewrap"><table class="list"><thead><tr><th>Business</th><th>Owner login</th><th class="num">Locations</th><th class="num">Users</th><th>Status</th><th>Add-ons</th><th></th></tr></thead><tbody>
    ${list.map((b) => `<tr class="${b.active ? '' : 'off'}"><td><b>${esc(b.name)}</b></td><td>${esc(b.owner_email || '')}</td><td class="num">${b.location_count}</td><td class="num">${b.user_count}</td>
      <td>${b.active ? '<span class="pill">Active</span>' : '<span class="pill off">Off</span>'}</td>
      <td><button class="${b.rentals_enabled ? 'rentson' : 'ghost'}" data-rentals="${b.id}" data-on="${b.rentals_enabled}" title="Rentals add-on">🔑 Rentals ${b.rentals_enabled ? 'on' : 'off'}</button></td>
      <td style="white-space:nowrap"><button class="primary" data-enter="${b.id}">Open</button> <button data-toggle="${b.id}" data-active="${b.active}">${b.active ? 'Turn off' : 'Turn on'}</button></td></tr>`).join('')
      || '<tr><td colspan="7" class="muted">No businesses yet. Create the first one.</td></tr>'}
    </tbody></table></div>`;
  $('#addBiz').onclick = async () => {
    if (await saveLoop('New business', [
      { name: 'name', label: 'Business name', required: true },
      { name: 'location_name', label: 'First location name', required: true },
      { name: 'tax_rate', label: 'Sales tax rate (%)', type: 'number', required: true },
      { name: 'owner_name', label: 'Owner name', required: true },
      { name: 'owner_email', label: 'Owner login email', type: 'email', required: true },
      { name: 'owner_password', label: 'Owner password (8+ characters)', type: 'password', required: true },
    ], { location_name: 'Main Location', tax_rate: 8.25 }, (v) => api('/api/admin/businesses', v), 'Create business')) showBusinesses();
  };
  $('#view').onclick = async (e) => {
    const en = e.target.closest('[data-enter]'), tg = e.target.closest('[data-toggle]'), rt = e.target.closest('[data-rentals]');
    if (rt) {
      const on = rt.dataset.on !== 'true';
      if (!on && !confirm('Turn off Rentals for this business? Rental screens will be hidden. Nothing is deleted.')) return;
      await api('/api/admin/businesses/' + rt.dataset.rentals, { rentals_enabled: on }, 'PUT'); showBusinesses(); return;
    }
    if (en) { await api('/api/admin/enter/' + en.dataset.enter, {}); location.hash = 'products'; location.reload(); }
    if (tg) {
      const turnOn = tg.dataset.active !== 'true';
      if (!turnOn && !confirm('Turn off this business? Its employees will not be able to log in.')) return;
      await api('/api/admin/businesses/' + tg.dataset.toggle, { active: turnOn }, 'PUT'); showBusinesses();
    }
  };
}
async function exitBusiness() { await api('/api/admin/exit', {}); location.hash = 'businesses'; location.reload(); }

// ---------- products ----------
let productQuery = '';
async function showProducts() {
  const canEdit = role !== 'cashier';
  const list = await api('/api/products?all=1&q=' + encodeURIComponent(productQuery));
  $('#view').innerHTML = `<div class="bar"><h2>Products</h2><input id="pq" placeholder="Search name, barcode, category" value="${esc(productQuery)}">
    ${canEdit ? '<button class="primary" id="addProd">+ Add product</button>' : ''}</div>
    <div class="tablewrap"><table class="list"><thead><tr><th></th><th>Product</th><th>Barcode</th><th>Category</th><th class="num">Price</th><th>Tax</th><th class="num">Stock</th><th></th></tr></thead><tbody>
    ${list.map((p) => `<tr class="${p.active ? '' : 'off'}">
      <td>${p.has_image ? `<img class="thumb" src="${productImg(p.id, p.image_version)}" alt="" loading="lazy">` : '<div class="thumb none">📷</div>'}</td>
      <td><b>${esc(p.name)}</b>${p.active ? '' : ' <span class="pill off">Hidden</span>'}</td><td>${esc(p.barcode || '')}</td><td>${esc(p.category || '')}</td>
      <td class="num">${p.is_rental ? `<span class="pill rentpill">Rental</span><div class="muted" style="font-size:12px">${[['rate_half_day', '½ day'], ['rate_day', 'day'], ['rate_week', 'week'], ['rate_month', 'month']].filter(([k]) => p[k] != null).map(([k, l]) => `${money(p[k])}/${l}`).join(' · ')}</div>` : money(p.price_cents)}</td><td>${p.taxable ? 'Yes' : 'No'}</td><td class="num">${p.is_rental ? p.rental_units + ' units' : p.track_stock ? p.stock_qty : '—'}</td>
      <td style="white-space:nowrap">${canEdit ? `<button data-edit="${p.id}">Edit</button> <button data-photo="${p.id}">Photo</button>` : ''}</td></tr>`).join('')
      || '<tr><td colspan="8" class="muted">No products found.</td></tr>'}</tbody></table></div>`;
  let t; $('#pq').oninput = () => { clearTimeout(t); t = setTimeout(() => { productQuery = $('#pq').value; showProducts().then(() => { const q = $('#pq'); q.focus(); q.setSelectionRange(q.value.length, q.value.length); }); }, 300); };
  const fields = productForm();
  // Saves the product, then its photo (if a new one was picked or it was removed).
  async function savePhoto(id, photo) {
    if (photo === 'remove') await api(`/api/products/${id}/image`, undefined, 'DELETE');
    else if (photo) await api(`/api/products/${id}/image`, { data_url: photo }, 'PUT');
  }
  let createdId = null;
  if (canEdit) $('#addProd').onclick = async () => {
    createdId = null;
    if (await saveLoop('Add product', fields, { taxable: true, active: true, stock_qty: 0, rental_units: 1 }, async (v) => {
      const { photo, ...product } = checkProduct(v);
      // If the photo failed last time, don't create the product twice.
      if (!createdId) createdId = (await api('/api/products', product)).id;
      else await api('/api/products/' + createdId, product, 'PUT');
      await savePhoto(createdId, photo);
    })) showProducts();
    else if (createdId) showProducts();
  };
  $('#view').onclick = async (e) => {
    const ph = e.target.closest('[data-photo]');
    if (ph) { openPhoto(list.find((x) => x.id === Number(ph.dataset.photo))); return; }
    const b = e.target.closest('[data-edit]'); if (!b) return;
    const p = list.find((x) => x.id === Number(b.dataset.edit));
    const values = { ...p, photo: p.has_image ? productImg(p.id, p.image_version) : null };
    if (await saveLoop('Edit product', fields, values, async (v) => {
      const { photo, ...product } = checkProduct(v);
      await api('/api/products/' + p.id, product, 'PUT');
      await savePhoto(p.id, photo);
    })) showProducts();
  };
}

// ---------- product photo ----------
let photoProduct = null, photoChanged = false;
function showPhotoState() {
  const p = photoProduct;
  $('#photoTitle').textContent = 'Photo: ' + p.name;
  $('#photoPreview').hidden = !p.has_image; $('#photoNone').hidden = p.has_image;
  $('#photoRemove').hidden = !p.has_image;
  if (p.has_image) $('#photoPreview').src = productImg(p.id, p.image_version);
}
function openPhoto(p) {
  photoProduct = { ...p }; photoChanged = false;
  showPhotoState(); $('#photoModal').classList.add('open');
}
$('#photoPick').onclick = () => $('#photoFile').click();
$('#photoFile').onchange = async () => {
  const file = $('#photoFile').files[0]; $('#photoFile').value = '';
  if (!file) return;
  $('#photoPick').disabled = true; $('#photoPick').textContent = 'Uploading…';
  try {
    const dataUrl = await resizeImage(file);
    await api(`/api/products/${photoProduct.id}/image`, { data_url: dataUrl }, 'PUT');
    photoProduct.has_image = true; photoProduct.image_version = Date.now(); photoChanged = true;
    $('#photoPreview').src = dataUrl; showPhotoState(); $('#photoPreview').src = dataUrl;
    toast('Photo saved');
  } catch (e) { toast(e.message, 'bad'); }
  finally { $('#photoPick').disabled = false; $('#photoPick').textContent = 'Choose or take a photo'; }
};
$('#photoRemove').onclick = async () => {
  if (!confirm('Remove this photo?')) return;
  try {
    await api(`/api/products/${photoProduct.id}/image`, undefined, 'DELETE');
    photoProduct.has_image = false; photoChanged = true; showPhotoState(); toast('Photo removed');
  } catch (e) { toast(e.message, 'bad'); }
};
$('#photoClose').onclick = () => { $('#photoModal').classList.remove('open'); if (photoChanged) showProducts(); };

// ---------- pending items ----------
let pendingStatus = 'pending';
async function showPending() {
  const data = await api('/api/pending?status=' + pendingStatus);
  setPendingBadge(data.pending_count);
  const list = data.items;
  const tab = (s, label) => `<button class="${s === pendingStatus ? 'primary' : 'ghost'}" data-status="${s}">${label}</button>`;
  $('#view').innerHTML = `<div class="bar"><h2>Pending items</h2>${tab('pending', `Waiting (${data.pending_count})`)}${tab('approved', 'Approved')}${tab('dismissed', 'Dismissed')}</div>
    <p class="muted" style="margin-top:0">Items scanned at the register that weren't in Products. Approve one to add it to Products with your price, or dismiss it.</p>
    <div class="pgrid">${list.map((p) => `<div class="pcard">
      ${p.has_image ? `<img src="/api/pending/${p.id}/image?v=${p.image_version}" alt="">` : '<div class="pnone">📷<span>No photo</span></div>'}
      <div class="pbody">
        <b>${esc(p.name)}</b>
        <div>${p.barcode ? `Barcode <b>${esc(p.barcode)}</b>` : '<span class="muted">No barcode</span>'}</div>
        <div>Charged ${p.price_cents == null ? '—' : money(p.price_cents)}${p.times_seen > 1 ? ` · <span class="pill">scanned ${p.times_seen}×</span>` : ''}</div>
        ${p.note ? `<div class="muted">Note: ${esc(p.note)}</div>` : ''}
        <div class="muted" style="font-size:13px">${esc(p.reported_by || '')} · ${new Date(p.updated_at).toLocaleString()}</div>
        ${p.existing_product && p.status === 'pending' ? `<div class="warn">This barcode is already in Products as <b>${esc(p.existing_product)}</b>. You can dismiss this one.</div>` : ''}
        ${p.status === 'pending' ? `<div class="pact"><button class="primary" data-approve="${p.id}">Approve & add to Products</button><button class="ghost" data-dismiss="${p.id}">Dismiss</button></div>`
          : `<div class="muted" style="font-size:13px">${p.status === 'approved' ? 'Approved' : 'Dismissed'}${p.resolved_by_name ? ' by ' + esc(p.resolved_by_name) : ''} · ${new Date(p.resolved_at).toLocaleString()}</div>`}
      </div></div>`).join('') || `<p class="muted">${pendingStatus === 'pending' ? 'Nothing waiting. 👍' : 'None yet.'}</p>`}</div>`;
  $('#view').onclick = async (e) => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.status) { pendingStatus = t.dataset.status; showPending(); return; }
    if (t.dataset.dismiss) {
      if (!confirm('Dismiss this item? It will not be added to Products.')) return;
      try { await api(`/api/pending/${t.dataset.dismiss}/dismiss`, {}); toast('Dismissed'); showPending(); } catch (err) { toast(err.message, 'bad'); }
    }
    if (t.dataset.approve) {
      const p = list.find((x) => x.id === Number(t.dataset.approve));
      const values = { name: p.name, barcode: p.barcode || '', price_cents: p.price_cents, taxable: true, active: true, stock_qty: 0,
        photo: p.has_image ? `/api/pending/${p.id}/image?v=${p.image_version}` : null };
      if (await saveLoop('Approve: add to Products', productForm(), { ...values, rental_units: 1 },
        (v) => api(`/api/pending/${p.id}/approve`, checkProduct(v)), 'Add to Products')) showPending();
    }
  };
}
function setPendingBadge(n) {
  pendingCount = n;
  const a = $('#nav a[href="#pending"]');
  if (a) a.innerHTML = 'Pending items' + (n ? ` <span class="badge">${n}</span>` : '');
}

// ---------- refunds owed (checks to mail) ----------
let refundStatus = 'owed';
async function showRefunds() {
  const data = await api('/api/refunds?status=' + refundStatus);
  const tab = (s, label) => `<button class="${s === refundStatus ? 'primary' : 'ghost'}" data-status="${s}">${label}</button>`;
  const methodName = { cash: 'Cash', gift_card: 'Gift card', check: 'Check' };
  $('#view').innerHTML = `<div class="bar"><h2>Refunds</h2>${tab('owed', `Checks to mail (${data.owed.n})`)}${tab('paid', 'Checks sent')}${tab('done', 'Cash & gift card refunds')}</div>
    ${refundStatus === 'owed' ? `<p class="muted" style="margin-top:0">Rental refunds the customer chose to get by check. Total owed: <b>${money(data.owed.total)}</b>. Mark each one paid when the check is mailed.</p>` : ''}
    <div class="tablewrap"><table class="list"><thead><tr><th>Date</th><th>Customer</th><th>For</th><th>How</th><th class="num">Amount</th><th></th></tr></thead><tbody>
    ${data.refunds.map((f) => `<tr><td>${new Date(f.created_at).toLocaleDateString()}<div class="muted" style="font-size:12px">${esc(f.location_name || '')} · ${esc(f.created_by_name || '')}</div></td>
      <td><b>${esc(f.customer_name || '')}</b><div class="muted" style="font-size:12px">${esc(f.customer_phone || '')}</div>${f.mailing_address ? `<div style="font-size:13px">${esc(f.mailing_address)}</div>` : ''}</td>
      <td>${f.rental_item ? 'Rental #' + f.rental_id + ': ' + esc(f.rental_item) : ''}${f.note ? `<div class="muted" style="font-size:12px">${esc(f.note)}</div>` : ''}</td>
      <td>${methodName[f.method]}${f.gift_code ? `<div class="muted" style="font-size:12px">${esc(f.gift_code)}</div>` : ''}${f.check_number ? `<div class="muted" style="font-size:12px">Check #${esc(f.check_number)}</div>` : ''}${f.paid_at ? `<div class="muted" style="font-size:12px">Sent ${new Date(f.paid_at).toLocaleDateString()}${f.paid_by_name ? ' by ' + esc(f.paid_by_name) : ''}</div>` : ''}</td>
      <td class="num"><b>${money(f.amount_cents)}</b></td>
      <td>${f.status === 'owed' ? `<button class="primary" data-paid="${f.id}">Mark check sent</button>` : ''}</td></tr>`).join('')
      || `<tr><td colspan="6" class="muted">${refundStatus === 'owed' ? 'No checks owed. 👍' : 'None yet.'}</td></tr>`}</tbody></table></div>`;
  $('#view').onclick = async (e) => {
    const t = e.target.closest('button'); if (!t) return;
    if (t.dataset.status) { refundStatus = t.dataset.status; showRefunds(); return; }
    if (t.dataset.paid) {
      const num = prompt('Check number (optional):', '');
      if (num === null) return;
      try { await api(`/api/refunds/${t.dataset.paid}/paid`, { check_number: num }); toast('Marked as sent'); showRefunds(); }
      catch (err) { toast(err.message, 'bad'); }
    }
  };
}

// ---------- locations & registers ----------
async function showLocations() {
  const [locs, regs] = await Promise.all([api('/api/locations'), api('/api/registers')]);
  const isOwner = role === 'owner';
  $('#view').innerHTML = `<div class="bar"><h2>Locations & registers</h2>${isOwner ? '<button class="primary" id="addLoc">+ Add location</button>' : ''}</div>
    ${locs.map((l) => `<div class="locbox"><h3><span>${esc(l.name)} ${l.active ? '' : '<span class="pill off">Off</span>'}</span>${isOwner ? `<button data-editloc="${l.id}">Edit</button>` : ''}</h3>
      <div class="muted">${esc(l.address || 'No address')} · Sales tax ${Number(l.tax_rate)}%</div>
      <div class="regs">${regs.filter((r) => r.location_id === l.id).map((r) => `<div class="reg">${esc(r.name)} ${r.active ? '' : '<span class="pill off">Off</span>'}<button data-editreg="${r.id}">Edit</button></div>`).join('')}
        <button data-addreg="${l.id}">+ Register</button></div></div>`).join('') || '<p class="muted">No locations yet.</p>'}`;
  const locFields = [
    { name: 'name', label: 'Location name', required: true },
    { name: 'address', label: 'Address (printed on receipts)' },
    { name: 'phone', label: 'Phone (printed on receipts)' },
    { name: 'tax_rate', label: 'Sales tax rate (%)', type: 'number', required: true },
    { name: 'active', label: 'Location is open for sales', type: 'check' },
  ];
  if (isOwner) $('#addLoc').onclick = async () => {
    if (await saveLoop('Add location', locFields, { tax_rate: 8.25, active: true }, (v) => api('/api/locations', { ...v, active: true }))) showLocations();
  };
  $('#view').onclick = async (e) => {
    const t = e.target;
    if (t.dataset.editloc) {
      const l = locs.find((x) => x.id === Number(t.dataset.editloc));
      if (await saveLoop('Edit location', locFields, { ...l, tax_rate: Number(l.tax_rate) }, (v) => api('/api/locations/' + l.id, v, 'PUT'))) showLocations();
    }
    if (t.dataset.addreg) {
      if (await saveLoop('Add register', [{ name: 'name', label: 'Register name', required: true }], { name: 'Register ' + (regs.filter((r) => r.location_id === Number(t.dataset.addreg)).length + 1) },
        (v) => api('/api/registers', { ...v, location_id: Number(t.dataset.addreg) }))) showLocations();
    }
    if (t.dataset.editreg) {
      const r = regs.find((x) => x.id === Number(t.dataset.editreg));
      if (await saveLoop('Edit register', [{ name: 'name', label: 'Register name', required: true }, { name: 'active', label: 'Register in use', type: 'check' }], r,
        (v) => api('/api/registers/' + r.id, v, 'PUT'))) showLocations();
    }
  };
}

// ---------- employees ----------
async function showEmployees() {
  const list = await api('/api/users');
  const roles = role === 'owner' ? ['owner', 'manager', 'cashier'] : ['cashier'];
  const roleOpts = roles.map((r) => ({ value: r, label: r[0].toUpperCase() + r.slice(1) }));
  $('#view').innerHTML = `<div class="bar"><h2>Employees</h2><button class="primary" id="addUser">+ Add employee</button></div>
    <p class="muted" style="margin-top:0">Owners manage everything. Managers handle products, registers, cashiers and sales reports. Cashiers only use checkout.</p>
    <div class="tablewrap"><table class="list"><thead><tr><th>Name</th><th>Login email</th><th>Role</th><th>Status</th><th></th></tr></thead><tbody>
    ${list.map((u) => `<tr class="${u.active ? '' : 'off'}"><td><b>${esc(u.name)}</b></td><td>${esc(u.email)}</td><td>${esc(u.role)}</td><td>${u.active ? '<span class="pill">Active</span>' : '<span class="pill off">Off</span>'}</td>
      <td>${roles.includes(u.role) ? `<button data-edit="${u.id}">Edit</button>` : ''}</td></tr>`).join('')}</tbody></table></div>`;
  $('#addUser').onclick = async () => {
    if (await saveLoop('Add employee', [
      { name: 'name', label: 'Name', required: true },
      { name: 'email', label: 'Login email', type: 'email', required: true },
      { name: 'role', label: 'Role', type: 'select', options: roleOpts },
      { name: 'password', label: 'Password (8+ characters)', type: 'password', required: true },
    ], { role: 'cashier' }, (v) => api('/api/users', v))) showEmployees();
  };
  $('#view').onclick = async (e) => {
    const b = e.target.closest('[data-edit]'); if (!b) return;
    const u = list.find((x) => x.id === Number(b.dataset.edit));
    if (await saveLoop('Edit ' + u.name, [
      { name: 'name', label: 'Name', required: true },
      { name: 'role', label: 'Role', type: 'select', options: roleOpts },
      { name: 'password', label: 'New password', type: 'password', hint: 'Leave blank to keep the current password' },
      { name: 'active', label: 'Can log in', type: 'check' },
    ], { ...u, password: '' }, (v) => api('/api/users/' + u.id, v, 'PUT'))) showEmployees();
  };
}

// ---------- sales ----------
const today = () => new Date().toLocaleDateString('en-CA');
let salesFilter = null;
async function showSales() {
  const locs = await api('/api/locations');
  salesFilter = salesFilter || { from: today(), to: today(), location_id: '' };
  const tz = Intl.DateTimeFormat().resolvedOptions().timeZone;
  const q = new URLSearchParams({ ...salesFilter, tz });
  const data = await api('/api/sales?' + q);
  const sum = (k) => data.totals[k];
  const by = (m) => data.summary.find((r) => r.payment_method === m) || { total: 0, n: 0 };
  $('#view').innerHTML = `<div class="bar"><h2>Sales</h2>
      <input type="date" id="sFrom" value="${salesFilter.from}"> to <input type="date" id="sTo" value="${salesFilter.to}">
      <select id="sLoc"><option value="">All locations</option>${locs.map((l) => `<option value="${l.id}" ${String(l.id) === salesFilter.location_id ? 'selected' : ''}>${esc(l.name)}</option>`).join('')}</select></div>
    <div class="cards">
      <div class="stat"><div>Total sales</div><b>${money(sum('total'))}</b></div>
      <div class="stat"><div>Number of sales</div><b>${sum('n')}</b></div>
      <div class="stat"><div>Sales tax collected</div><b>${money(sum('tax'))}</b></div>
      <div class="stat"><div>Cash (${by('cash').n})</div><b>${money(by('cash').total)}</b></div>
      <div class="stat"><div>Card (${by('card').n})</div><b>${money(by('card').total)}</b></div>
      <div class="stat"><div>Other (${by('other').n})</div><b>${money(by('other').total)}</b></div>
      ${by('gift_card').n ? `<div class="stat"><div>Paid with gift cards (${by('gift_card').n})</div><b>${money(by('gift_card').total)}</b></div>` : ''}
      ${(() => {
        const rf = (m) => (data.refunds || []).find((r) => r.method === m) || { n: 0, total: 0 };
        if (!(data.refunds || []).length) return '';
        return `<div class="stat refund"><div>Cash refunds (${rf('cash').n})</div><b>−${money(rf('cash').total)}</b></div>
          <div class="stat"><div>Cash in drawer from sales</div><b>${money(by('cash').total - rf('cash').total)}</b></div>
          <div class="stat"><div>Gift cards issued (${rf('gift_card').n})</div><b>${money(rf('gift_card').total)}</b></div>
          <div class="stat"><div>Checks owed (${rf('check').n})</div><b>${money(rf('check').total)}</b></div>`;
      })()}
    </div>
    <div class="tablewrap"><table class="list"><thead><tr><th>#</th><th>Time</th><th>Location</th><th>Cashier</th><th>Paid by</th><th class="num">Total</th><th></th></tr></thead><tbody>
    ${data.sales.map((s) => `<tr class="${s.voided ? 'off' : ''}"><td>${s.id}</td><td>${new Date(s.created_at).toLocaleString()}</td><td>${esc(s.location_name)} · ${esc(s.register_name || '')}</td>
      <td>${esc(s.cashier || '')}</td><td>${esc(paidByText(s))}</td><td class="num">${money(s.total_cents)}${s.voided ? ' <span class="pill off">Void</span>' : ''}</td>
      <td style="white-space:nowrap"><button data-receipt="${s.id}">Receipt</button> <button class="wa" data-wa="${s.id}">WhatsApp</button>${s.voided ? '' : ` <button data-void="${s.id}">Void</button>`}</td></tr>`).join('')
      || '<tr><td colspan="7" class="muted">No sales in this period.</td></tr>'}</tbody></table></div>`;
  const refresh = () => { salesFilter = { from: $('#sFrom').value, to: $('#sTo').value, location_id: $('#sLoc').value }; showSales(); };
  $('#sFrom').onchange = refresh; $('#sTo').onchange = refresh; $('#sLoc').onchange = refresh;
  $('#view').onclick = async (e) => {
    const t = e.target;
    if (t.dataset.receipt) window.open('/receipt?id=' + t.dataset.receipt, '_blank', 'width=420,height=700');
    if (t.dataset.wa) openWhatsAppDialog(t.dataset.wa);
    if (t.dataset.void && confirm(`Void sale #${t.dataset.void}? It will be removed from the totals and tracked stock is put back.`)) {
      try { await api(`/api/sales/${t.dataset.void}/void`, {}); toast('Sale voided'); showSales(); } catch (err) { toast(err.message, 'bad'); }
    }
  };
}

// ---------- settings ----------
async function showSettings() {
  const isOwner = role === 'owner' && me.business;
  $('#view').innerHTML = `${isOwner ? `<div class="settings"><h2 style="margin-top:0">Business</h2>
      <label>Business name</label><input id="bName" value="${esc(me.business.name)}">
      <label>Accent color</label><input id="bColor" type="color" value="${esc(me.business.accent_color)}" style="height:44px;padding:4px">
      <label>Logo image URL (https://…)</label><input id="bLogo" value="${esc(me.business.logo_url || '')}" placeholder="Optional">
      ${me.business.rentals_enabled ? `<label>Rentals: a half day is how many hours?</label><input id="bHalf" type="number" min="1" max="12" value="${me.business.half_day_hours}">` : ''}
      <button class="primary" style="margin-top:14px" id="saveBiz">Save business</button></div>` : ''}
    <div class="settings"><h2 style="margin-top:0">My password</h2>
      <label>Current password</label><input id="pCur" type="password" autocomplete="current-password">
      <label>New password (8+ characters)</label><input id="pNew" type="password" autocomplete="new-password">
      <button class="primary" style="margin-top:14px" id="savePw">Change password</button></div>`;
  if (isOwner) $('#saveBiz').onclick = async () => {
    try { await api('/api/business', { name: $('#bName').value, accent_color: $('#bColor').value, logo_url: $('#bLogo').value,
      half_day_hours: $('#bHalf') ? $('#bHalf').value : null }, 'PUT'); toast('Saved'); setTimeout(() => location.reload(), 600); }
    catch (e) { toast(e.message, 'bad'); }
  };
  $('#savePw').onclick = async () => {
    try { await api('/api/me/password', { current: $('#pCur').value, password: $('#pNew').value }); toast('Password changed'); $('#pCur').value = $('#pNew').value = ''; }
    catch (e) { toast(e.message, 'bad'); }
  };
}

const views = { businesses: showBusinesses, products: showProducts, pending: showPending, refunds: showRefunds, locations: showLocations, employees: showEmployees, sales: showSales, settings: showSettings };
function route() {
  const tabs = TABS.filter((t) => t.show());
  let id = location.hash.slice(1);
  if (!tabs.some((t) => t.id === id)) id = tabs[0].id;
  $('#nav').innerHTML = (me.business ? '<a href="/checkout">Checkout</a>' : '') +
    tabs.map((t) => `<a href="#${t.id}" class="${t.id === id ? 'active' : ''}">${t.label}</a>`).join('');
  $('#view').onclick = null;
  setPendingBadge(pendingCount);
  if (me.business && id !== 'pending') api('/api/pending/count').then((r) => setPendingBadge(r.pending_count)).catch(() => {});
  views[id]().catch((e) => toast(e.message, 'bad'));
}

(async () => {
  me = await api('/api/me');
  role = me.user.role === 'admin' ? 'owner' : me.user.role;
  if (me.user.role === 'cashier') { location.href = '/checkout'; return; }
  if (me.business) { applyBrand(me.business); $('#bizName').textContent = me.business.name; }
  if (me.user.role === 'admin' && me.business) { $('#actingBanner').hidden = false; $('#actingName').textContent = me.business.name; }
  window.addEventListener('hashchange', route);
  route();
})().catch((e) => toast(e.message, 'bad'));
</script>
</body>
</html>
